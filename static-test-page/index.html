<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Static Test Page</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1f2430;
      --muted: #6b7280;
      --accent: #2563eb;
      --ok: #16a34a;
      --border: #e5e7eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --card: #171a21;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --border: #2a2f3a;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 4px; }
    .subtitle { color: var(--muted); font-size: 0.95rem; margin-bottom: 24px; }
    .badge {
      display: inline-block;
      background: var(--ok);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 16px;
    }
    dl {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px 16px;
      font-size: 0.9rem;
      margin: 24px 0;
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }
    dt { color: var(--muted); font-weight: 500; }
    dd { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
    footer {
      margin-top: 24px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">OK</span>
    <h1>Static Test Page</h1>
    <p class="subtitle">A self-contained static page for testing rendering, styles, and script execution.</p>

    <dl>
      <dt>JavaScript</dt>
      <dd id="js-status">disabled</dd>
      <dt>Loaded at</dt>
      <dd id="load-time">n/a</dd>
      <dt>Viewport</dt>
      <dd id="viewport">n/a</dd>
      <dt>User agent</dt>
      <dd id="user-agent">n/a</dd>
    </dl>

    <footer>Static page &middot; no external dependencies</footer>
  </main>

  <script>
    document.getElementById('js-status').textContent = 'enabled';
    document.getElementById('load-time').textContent = new Date().toISOString();
    document.getElementById('viewport').textContent = window.innerWidth + 'x' + window.innerHeight;
    document.getElementById('user-agent').textContent = navigator.userAgent;
  </script>
</body>
</html>
